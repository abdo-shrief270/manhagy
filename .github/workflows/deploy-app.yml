name: deploy-app

# After the API tests and the apps' builds pass on main, the server runs infra/production/ci-deploy.sh
# for this commit. Off until the APP_DEPLOY_* secrets exist (docs/DEPLOY.md).
on:
  workflow_run:
    workflows: [api, apps]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy-app

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          KEY: ${{ secrets.APP_DEPLOY_KEY }}
          HOST: ${{ secrets.APP_DEPLOY_HOST }}
          USER: ${{ secrets.APP_DEPLOY_USER }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          if [ -z "$KEY" ] || [ -z "$HOST" ]; then
            echo "No APP_DEPLOY_* secrets yet: nothing to deploy."
            exit 0
          fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null ~/key && printf '%s\n' "$KEY" > ~/key
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          ssh -i ~/key "$USER@$HOST" "deploy $SHA"

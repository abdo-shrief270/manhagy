# منهجي's live server on a machine of its own (when live lessons outgrow the main server): LiveKit,
# Egress (recordings), optional Ingress (OBS), Caddy. Run from this directory: docker compose up -d.
# Then on the main server: remove livekit / egress / ingress from infra/production/compose.yml and set
# its LIVEKIT_* to this server (see README.md).
name: manhagy-live

services:
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.10}
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVE_PUBLIC_IP}
        redis:
          address: redis:6379
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        ingress:
          rtmp_base_url: rtmp://${LIVE_DOMAIN}:1935/live
        room:
          empty_timeout: 3600
        logging:
          level: warn
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      - redis

  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.10.0}
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        log_level: warn
    volumes:
      - recordings:/out
    depends_on:
      - livekit

  ingress:
    image: ${LIVEKIT_INGRESS_IMAGE:-livekit/ingress:v1.4.3}
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
        rtmp_port: 1935
    ports:
      - "1935:1935"
    depends_on:
      - livekit

  # Only the three LiveKit services talk to it (rooms, Egress / Ingress jobs); never published.
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # The main server downloads each recording after the lesson; whatever is older than a week goes.
  cleaner:
    image: alpine:3.20
    restart: unless-stopped
    command: ["sh", "-c", "while true; do find /out -name '*.mp4' -mtime +7 -delete; sleep 86400; done"]
    volumes:
      - recordings:/out

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      LIVE_DOMAIN: ${LIVE_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
      MAIN_SERVER_IP: ${MAIN_SERVER_IP}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - recordings:/recordings:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - livekit

volumes:
  recordings:
  caddy_data:
  caddy_config:

# منهجي's broadcast server (MediaMTX). Every publish / read / recording download / API call is
# decided by the API's hook (authMethod: http): teachers publish with their session's stream key,
# students read with a token bound to their attendance. Runs as the `live` compose service, or on a
# server of its own (infra/live): only the addresses in .env change.
# Values from the environment (compose): MTX_AUTHHTTPADDRESS, MTX_WEBRTCADDITIONALHOSTS.

logLevel: info
readTimeout: 10s
writeTimeout: 10s

authMethod: http
authHTTPAddress: http://api/api/v1/public/live/hook/CHANGE_ME
authHTTPExclude: []

# Internal: what's on air (live:sync) and recordings (CollectRecording), as the API's service user.
api: true
apiAddress: :9997
playback: true
playbackAddress: :9996

rtsp: false
srt: false
moq: false
# OBS: rtmp://<live host>/live, stream key {session}?key=…
rtmp: true
rtmpAddress: :1935

# Students: https://<live host>/live/{session}/index.m3u8?t=… (behind Caddy).
hls: true
hlsAddress: :8888
hlsAllowOrigins: ['*']
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 2s
hlsPartDuration: 400ms

# The teacher's browser: https://<live host>/live/{session}/whip?key=… (behind Caddy); media over UDP 8189.
webrtc: true
webrtcAddress: :8889
webrtcAllowOrigins: ['*']
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: []

pathDefaults:
  source: publisher
  # Every broadcast is recorded; the API fetches it after the lesson, so a week is plenty here.
  record: true
  recordPath: /recordings/%path/%Y-%m-%d_%H-%M-%S-%f%z
  recordFormat: fmp4
  recordPartDuration: 1s
  recordSegmentDuration: 10m
  recordDeleteAfter: 7d

paths:
  # Only live/{session id}; any other name is refused.
  "~^live/[0-9a-f-]{36}$": {}

# Production stack. Run from this directory:  ./deploy.sh
# Secrets live in ./.env (created by ./init.sh, never committed).
name: manhagy

x-php: &php
  build:
    context: ../..
    dockerfile: infra/production/Dockerfile.api
  image: manhagy-api:latest
  env_file: .env
  restart: unless-stopped
  volumes:
    - storage:/app/storage
    # Live lesson recordings, written by Egress (/out there), taken into the video library by the worker.
    - live_recordings:/live-recordings
  depends_on:
    pgsql:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # The edge: HTTPS, the three apps (teachers, students on *.<domain>, admins), the landing page, the API.
  caddy:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.web
      args:
        APP_VERSION: ${APP_VERSION:-}
        SITES_HOST: ${SITES_HOST}
        SITE_URL: https://${SITES_HOST}
    image: manhagy-web:latest
    restart: unless-stopped
    environment:
      APP_ADDRESS: ${APP_DOMAIN}
      ADMIN_ADDRESS: ${ADMIN_DOMAIN:-http://admin.invalid}
      MARKET_ADDRESS: ${MARKET_DOMAIN:-http://market.invalid}
      LIVE_ADDRESS: ${LIVE_DOMAIN:-http://live.invalid}
      LANDING_ADDRESS: ${LANDING_ADDRESS:-http://landing.invalid}
      LANDING_DOMAIN: ${SITES_HOST}
      SITES_ADDRESS: ${SITES_ADDRESS:-*.${SITES_HOST}}
      SITES_TLS: ${SITES_TLS:-on-demand}
      SITES_HOST: ${SITES_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *php
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://localhost/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5

  # «سوق منهجي» (apps/market): server-rendered for search engines, on MARKET_DOMAIN.
  market:
    build:
      context: ../..
      dockerfile: infra/production/Dockerfile.market
    image: manhagy-market:latest
    restart: unless-stopped
    environment:
      NUXT_API_INTERNAL: http://api/api/v1
      NUXT_PUBLIC_MARKET_URL: https://${MARKET_DOMAIN:-market.invalid}
      NUXT_PUBLIC_SITE_URL: https://${SITES_HOST}
    depends_on:
      - api

  # Live lessons: LiveKit (WebRTC SFU — the delay of a call, students can speak when given the floor).
  # Browsers reach it at LIVE_DOMAIN (signalling through Caddy) and send / receive media straight on
  # 7882/udp (7881/tcp when UDP is blocked). Later on a server of its own:
  # infra/live (then remove livekit / egress / ingress here and point LIVEKIT_* there).
  livekit:
    image: ${LIVEKIT_IMAGE:-livekit/livekit-server:v1.13.10}
    restart: unless-stopped
    environment:
      # Read by livekit-server itself (--config-body).
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882 # every browser's media on one port
          use_external_ip: false
          node_ip: ${LIVE_PUBLIC_IP:-127.0.0.1}
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        keys:
          ${LIVEKIT_API_KEY:-APIunset}: ${LIVEKIT_API_SECRET:-unset}
        ingress:
          rtmp_base_url: rtmp://${LIVE_DOMAIN:-live.invalid}:1935/live
        room:
          empty_timeout: 3600
        logging:
          level: warn
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    depends_on:
      redis:
        condition: service_healthy

  # Records each lesson (the room composited, the speaker / shared screen large) into one MP4.
  egress:
    image: ${LIVEKIT_EGRESS_IMAGE:-livekit/egress:v1.10.0}
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN # Chrome's sandbox
    shm_size: 1gb
    environment:
      EGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-APIunset}
        api_secret: ${LIVEKIT_API_SECRET:-unset}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        log_level: warn
    volumes:
      - live_recordings:/out
    depends_on:
      - livekit
      - api # the shared folder is made by the api image (writable by the worker, which takes the files away)

  # OBS (RTMP → the room as the teacher). Optional: COMPOSE_PROFILES=obs and LIVEKIT_INGRESS=true.
  ingress:
    image: ${LIVEKIT_INGRESS_IMAGE:-livekit/ingress:v1.4.3}
    restart: unless-stopped
    profiles: ["obs"]
    environment:
      INGRESS_CONFIG_BODY: |
        api_key: ${LIVEKIT_API_KEY:-APIunset}
        api_secret: ${LIVEKIT_API_SECRET:-unset}
        ws_url: ws://livekit:7880
        redis:
          address: redis:6379
          password: ${REDIS_PASSWORD}
        rtmp_port: 1935
        logging:
          level: warn
    ports:
      - "1935:1935"
    depends_on:
      - livekit

  worker:
    <<: *php
    command: ["php", "artisan", "horizon"]
    stop_grace_period: 60s
    healthcheck:
      disable: true

  scheduler:
    <<: *php
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      disable: true

  pgsql:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      retries: 20

  # Daily pg_dump + the stored files into ./backups (kept BACKUP_KEEP_DAYS), optionally copied off-site with rclone.
  backup:
    build:
      context: .
      dockerfile: Dockerfile.backup
    image: manhagy-backup:latest
    restart: unless-stopped
    env_file: .env
    environment:
      PGHOST: pgsql
      PGPORT: "5432"
      PGUSER: ${DB_USERNAME}
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: ${DB_DATABASE}
      TZ: ${BACKUP_TZ:-Africa/Cairo}
    volumes:
      - ./backups:/backups
      - storage:/storage:ro
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -n \"$$(find /backups -maxdepth 1 -name .last-success -mmin -1500)\""]
      interval: 5m
      timeout: 10s
      start_period: 30m

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      retries: 20

volumes:
  pgdata:
  redisdata:
  storage:
  live_recordings:
  caddy_data:
  caddy_config:

# nginx in front of the stack (compose.nginx.yml). Replace manhagy.online with your domain.
# Certificates: the root + www + app + admin from certbot --nginx, and a wildcard *.manhagy.online
# (needs the DNS challenge, e.g. certbot certonly --dns-cloudflare -d '*.manhagy.online' -d manhagy.online).
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name manhagy.online *.manhagy.online;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name manhagy.online *.manhagy.online;

    ssl_certificate     /etc/letsencrypt/live/manhagy.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/manhagy.online/privkey.pem;

    client_max_body_size 60m;   # PDFs up to 50 MB

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;        # live lessons (LL-HLS) and big uploads stream through
    }
}
